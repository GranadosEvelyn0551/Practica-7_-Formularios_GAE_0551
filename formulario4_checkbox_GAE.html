<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Formularios en HTML</title>
	<!-- Libreria de iconos en linea -->
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-
	awesome/7.3.1/css/all.min.css">
</head>

<body>
	<h2>Formularios con checkbox</h2>
	<!-- <form> crea un formulario y method indica como se envian los datos -->
	<form action="" method="post">Ingresa tu nombre:
		<!-- type indica que es un campo de texto y name identifica el campo -->
		<input type="text" name="nombre"><br>
		Selecciona los lenguajes que conozcas:<br>
		<!-- type checkbox permite seleccionar una o varias opciones -->
		<input type="checkbox" name="Java">Java <br>
		<input type="checkbox" name="Python"> Python <br>
		<input type="checkbox" name="C#">C# <br>
		<input type="checkbox" name="Flutter"> Flutter <br>
	</form>
</body>
</html>
