<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Formularios en HTML</title>
	<!-- Libreria de iconos en linea -->
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-
	awesome/7.3.1/css/all.min.css">
</head>

<body>
	<h2>Formulario con campos ocultos</h2>
	<!-- <font> crea un formulario y method indica como se envian los datos -->
	<form action="" method="post">
		<!-- type hidden oculta el campo y value guarda su valor -->
		<input type="hidden" name="hora" value="3:30">
		Ingresa tu nombre:<input type="text" name="nombre"><br>
		<!-- button crea un boton y type submit permite enviar el formulario -->
		<button type="submit">Enviar <i class="fa-regular fa-paper-plane"></i> </button>
		<!-- type reset permite borrar los datos del formulario -->
		<button type="reset">Borrar <i class="fa fa-trash"></i></button>
	</form>
</body>
</html>
