<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formularios en HTML</title>
  <!-- Libreria de iconos en linea -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-
    awesome/7.3.1/css/all.min.css">
</head>
<body>
  <h2>Formulario para contraseñas</h2>
  <!--<form> crea un formulario y method indica como se envian los datos -->
  <form action="" method="post">Ingresa tu usuario:
    <!--type indica el tipo de campo y name identifica el campo -->
    <input type="text" name="usuario">Ingresa tu contraseña:
    <!--type password oculta el texto escrito -->
    <input type="password" name="pass"><br>
    <!--type submit crea un boton para enviar el formulario y value indica su texto -->
    <input type="submit" value="enviar">
    <!--type reset crea un boton para borrar los datos -->
    <input type="reset" value="borrar">
  </form>
</body>
</html>
