<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Formularios en HTML</title>
	<!-- Libreria de iconos en linea -->
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-
	awesome/7.3.1/css/all.min.css">
</head>

<body>
	<h2>Formularios con agrupamiento</h2>
	<!-- <font> crea un formulario y method indica como se envian los datos -->
	<form action="" method="post">
		<!-- Agrupa elementos relacionados del formulario -->
		<fieldset>
			<!-- <legend> crea un titulo para el grupo -->
			<legend>Datos personales</legend>
			<!-- type text crea un campo de texto y name identifica el campo -->
			Nombre y apellido:<input type="text" name="nombre_apellido"><br>
			<!-- type file permite seleccionar un archivo -->
			Documento valido:<input type="file" name="documento"><br>
			<!-- type date permite seleccionar una fecha -->
			Fecha de nacimiento:<input type="date" name="fecha_nacimiento">
		</fieldset>

		<fieldset>
			<legend>Datos de estudio:</legend>
			Nombre de la escuela:<input type="text" name="escuela"><br>
			Certificado valido:<input type="file" name="certificado"><br>
			Fecha de egreso:<input type="date" name="fecha_egreso">
		</fieldset><br>
		<!-- button crea un boton y type submit permite enviar el formulario -->
		<button type="submit">Enviar <i class="fa-regular fa-paper-plane"></i> </button>
		<!-- type reset permite borrar los datos del formulario -->
		<button type="reset">Borrar <i class="fa fa-trash"></i></button>
	</form>
</body>
</html>
