<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Formularios en HTML</title>
	<!-- Libreria de iconos en linea -->
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-
	awesome/7.3.1/css/all.min.css">
</head>

<body>
	<h2>Formularios con seleccion</h2>
	<!-- <font> crea un formulario y method indica como se envian los datos -->
	<form action="" method="post">Ingresa tu nombre:
		<!-- type indica que es un campo de texto y name identifica el campo -->
		<input type="text" name="nombre"><br>

		Selecciona tu pais:
		<!-- select crea una lista de opciones -->
		<select name="pais">
			<!-- option crea cada opcion y value identifica su valor -->
			<option value="1">Argentina</option>
			<option value="2">España</option>
			<option value="3">Mexico</option>
			<option value="4">Guatemala</option>
			<option value="5">Honduras</option>
			<option value="6">El Salvador</option>
			<option value="7">Venezuela</option>
			<option value="8">Colombia</option>
		</select><br>
		<!-- type submit crea un boton para enviar el formulario -->
		<!-- value indica el texto que muestra el boton -->
		<input type="submit" value="enviar">
		<!-- type reset crea un boton para borrar los datos -->
		<input type="reset" value="borrar">
	</form>
</body>
</html>
