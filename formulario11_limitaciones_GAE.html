<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Formularios en HTML</title>
	<!-- Libreria de iconos en linea -->
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-
	awesome/7.3.1/css/all.min.css">
</head>

<body>
	<h2>Formulario con limitaciones</h2>
	<!-- <form> crea un formulario y method indica como se envian los datos -->
	<form action="" method="post">
		Ingresa tu nombre:
		<!-- disabled deshabilita el campo -->
		<input type="text" name="nombre" disabled><br>
		<!-- maxlength limita la cantidad de caracteres permitidos -->
		Contraseña:
		<input type="password" name="pass" maxlength="5"><br>
		<!-- readonly impide modificar el contenido del campo -->
		Comentarios:
		<textarea name="comentarios" readonly> Este es mi comentario y no se 
		puede borrar</textarea><br>
	</form>
</body>
</html>
